<h3>Condiciones Generales:</h3>
<div class="cond">El cliente deber\xE1 pagar el 50 % de anticipo (referirse a pol\xEDtica de anticipos).
El saldo deber\xE1 liquidarse contra aviso de disponibilidad, si no cuenta con l\xEDnea de cr\xE9dito.</div>
<h3>Notas de Escalaci\xF3n:</h3>
<div class="cond"><span class="u">Esta cotizaci\xF3n no incluye el 16 % de IVA</span>, el cual se cargar\xE1 al momento de la facturaci\xF3n de los eventos de anticipo y finiquito.
Los precios presentados est\xE1n sujetos a cambio sin previo aviso, debido a que est\xE1n basados en la paridad peso/d\xF3lar y ser\xE1n ajustados al tipo de cambio vigente.

Esta cotizaci\xF3n no incluye servicio de configuraci\xF3n y puesta en marcha a menos que se indique, en caso de requerir este servicio solicitar su cotizaci\xF3n por separado.

DESVIACIONES Y/O ACLARACIONES
El equipo cotizado es de acuerdo a nuestra mejor interpretaci\xF3n, basada en la informaci\xF3n recibida, por lo que ser\xE1 obligaci\xF3n del cliente el revisar y aprobar dicha cotizaci\xF3n, en el entendido que si existiera alguna omisi\xF3n o diferencia de acuerdo a sus necesidades se requerir\xE1 de una nueva cotizaci\xF3n.
Los tiempos de entrega del equipo indicados en esta cotizaci\xF3n ser\xE1n a partir de recibir el anticipo correspondiente.

CANCELACIONES
Elektron del Baj\xEDo no acepta la cancelaci\xF3n de pedidos de equipos y/o servicios de Ingenier\xEDa y proyectos, ya que su dise\xF1o y fabricaci\xF3n se basa en especificaciones que satisfacen las necesidades particulares de un cliente. En caso de que esto ocurriera, el cargo se determinar\xE1 por los gastos realizados e insumos comprados espec\xEDficamente para ese pedido y dependiendo de la etapa en que se encuentre con base en los siguientes porcentajes:
\u2022 10% Cuando se haya recibido el pedido del Cliente
\u2022 35% Cuando se encuentre en la etapa de ingenier\xEDa
\u2022 50 al 75% Cuando se encuentre en la etapa de compra de materiales y/o ensamble
\u2022 100% Cuando est\xE9 terminada la orden

N O T A S:
1. Tiempo de entrega:
A) Cuando no se requiere planos para aprobaci\xF3n. El tiempo de entrega para el equipo cotizado, ser\xE1 contado a partir de la fecha de recibir su orden con toda la informaci\xF3n de especificaciones t\xE9cnicas del equipo, as\xED como su anticipo correspondiente.
B) Cuando se requieran planos para aprobaci\xF3n. El tiempo de entrega ser\xE1 contado a partir de la fecha de recibir los planos 100% aprobados, previo env\xEDo de su orden, con toda la informaci\xF3n necesaria y su anticipo correspondiente.
Los tiempos de entrega indicados corresponden a la mejor estimaci\xF3n que podemos dar en el momento de emitir esta cotizaci\xF3n.
Se debe considerar de 3 a 5 d\xEDas h\xE1biles adicionales para entrega en Sitio.
Se consideran los d\xEDas h\xE1biles presentados de lunes a viernes siempre y cuando no sean feriados.
C) Los tiempos de entrega descritos en esta cotizaci\xF3n son salvo previa venta y pueden variar sin previo aviso.
2. Es necesario que revisen nuestra oferta ya que se realiza de acuerdo con nuestra interpretaci\xF3n, en caso de existir alg\xFAn cambio o comentario, favor de comunicarlo a nuestro Vendedor.
3. Nos reservamos el derecho de corregir cualquier error de \xEDndole t\xE9cnico comercial que pudiera presentarse en esta cotizaci\xF3n.
4. Si nos vemos favorecidos con su amable pedido, favor de indicar el n\xFAmero completo de esta cotizaci\xF3n y colocarlo a nombre de Elektron del Baj\xEDo, S.A. de C.V., en el entendido de que el equipo cotizado cumple con sus requerimientos.
5. Se anexan condiciones generales de venta.
6. Elektron del Baj\xEDo, S.A. de C.V. no acepta multas o penalizaciones de ninguna especie.
7. La validez de este formato aplica solo para dise\xF1os de Ingenier\xEDa y Proyectos.

gleta",t:"Barra superior (regleta de estado)",c:["Los tres indicadores son lecturas en vivo, como un panel HMI: tiempo registrado hoy (rojo parpadeando si el cron\xF3metro corre), pendientes de hoy + vencidos, y el total cotizado del pipeline (lo que tienes en la calle esperando respuesta). T\xF3calos para saltar a su pesta\xF1a.","El punto cambia de color seg\xFAn el estado: verde = en orden, \xE1mbar = requiere atenci\xF3n, rojo = hay vencidos.","Nube (\u2601\uFE0F) = Cuenta y sincronizaci\xF3n. Ubicaci\xF3n (\u{1F4CD}) = Visitas y check-in. Micr\xF3fono = Asistente por voz. Signo de interrogaci\xF3n = este manual.","Toca el nombre Brida para volver a la pantalla de inicio con tu resumen del d\xEDa en cualquier momento."]},{id:"hoy",t:"Hoy \u2014 pendientes",c:["Captura r\xE1pida: escribe el pendiente, elige Hoy / Ma\xF1ana / Otra fecha, opcionalmente una hora, y toca +.","Toca un pendiente para abrirlo: cliente, fecha, hora de inicio y fin, fecha de finalizaci\xF3n, prioridad y ligarlo a una oportunidad del pipeline.","Dentro del pendiente: Agendar lo manda pre-llenado a Google Calendar; el bot\xF3n de compartir lo env\xEDa individual a Google Tasks o Keep.","Comentarios: dentro de cada pendiente puedes anotar acuerdos o qu\xE9 resolviste; los pendientes con comentario muestran un \xEDcono de globo.","Los pendientes de hoy se ordenan por prioridad: primero los de prioridad alta y, dentro de cada nivel, por hora.","\u2192 ma\xF1ana lo reprograma con un toque. Las secciones Vencidas (rojo) y Acciones de pipeline (\xE1mbar) aparecen solo cuando existen.","Cerrar el d\xEDa: resumen de lo completado, tiempo registrado, opci\xF3n de mover todo lo incompleto a ma\xF1ana y alerta de oportunidades sin pr\xF3xima acci\xF3n. \xDAsalo cada tarde: nada se queda en la cabeza."]},{id:"tiempo",t:"Tiempo",c:["Cron\xF3metro: elige categor\xEDa (visitas, cotizaciones, llamadas, traslados, administrativo, capacitaci\xF3n), cliente opcional, Iniciar. Sigue corriendo aunque cierres la app; Detener y guardar registra los minutos.","+ Registro manual: para capturar tiempo pasado con fecha, minutos y categor\xEDa.","Las barras muestran tu d\xEDa por categor\xEDa y tu semana por d\xEDa (la barra \xE1mbar es hoy). En Registros recientes ves los \xFAltimos movimientos de cualquier d\xEDa y puedes eliminar cualquiera con la X, incluidos los de d\xEDas anteriores."]},{id:"pipeline",t:"Pipeline",c:["Flujo: Oportunidad entrante \u2192 Cotizado \u2192 Por cerrar \u2192 OC recibida \u2192 Pedido realizado \u2192 Facturado (o Perdido). Recibir la OC ya significa que la venta se gan\xF3.","Regla de oro: toda oportunidad activa debe tener pr\xF3xima acci\xF3n con fecha. La app te lo recuerda con la franja \xE1mbar y en el cierre del d\xEDa.","Activas son las que a\xFAn persigues: Oportunidad entrante, Cotizado y Por cerrar. Al recibir la OC dejan de ser activas porque ya se ganaron.","Tarjeta: toca para editar (cliente, monto, margen, marca, plaza, vendedor y los n\xFAmeros de referencia); Avanzar la pasa a la siguiente etapa; Agendar manda la pr\xF3xima acci\xF3n a Google Calendar.","El resumen muestra tres cifras: En juego (visita, cotizado y por cerrar), Pedido (OC y pedido) y Facturado (cobrado). El Acumulado por mes agrupa usando las fechas de OC, pedido y factura.","Desde Cotizado aparecen N\xB0 y fecha de cotizaci\xF3n; desde OC recibida, la OC del cliente con su fecha; desde Pedido, N\xB0 y fecha de pedido y de factura. Todo se muestra como etiquetas y sale en el CSV de Monday.","Margen: captura el porcentaje con que vendiste; se muestra en la tarjeta y alimenta el c\xE1lculo de comisiones.","Moneda: en cada oportunidad puedes capturar el monto en pesos o en d\xF3lares con el switch MXN/USD. Si eliges USD, se convierte y se guarda en pesos usando el tipo de cambio de la pantalla de inicio; la tarjeta muestra el monto original en d\xF3lares.","Comisiones: el bot\xF3n Calcular comisiones toma una oportunidad ya facturada, su monto y margen, y con tu porcentaje calcula utilidad y tu pago.","Pedir estatus a vendedores: el bot\xF3n agrupa tus oportunidades en curso por vendedor y arma un mensaje claro y numerado (cliente, monto, etapa, referencias y un rengl\xF3n Estatus para llenar). Elige cu\xE1les incluir y env\xEDalo por WhatsApp, Compartir o Copiar. Tambi\xE9n puedes pedir el estatus de una sola oportunidad desde su ficha.","Cuando cobres, avanza la oportunidad a Facturado. Las fechas de OC, pedido y factura se sellan solas al avanzar de etapa (y puedes editarlas).","El buscador encuentra por cliente, vendedor, marca, plaza y por n\xFAmero de cotizaci\xF3n, OC, pedido o factura. Los chips filtran por etapa (Todas al inicio, vista por defecto). Las tarjetas se ordenan por etapa y, dentro de cada etapa, de mayor a menor monto."]},{id:"metas",t:"Metas y proyectos",c:["Tres horizontes: corto (1\u20133 meses), mediano (3\u201312) y largo (1\u20133 a\xF1os). Agrega con el campo inferior y marca cumplidas con el c\xEDrculo.","Toca una meta para ponerle fecha de inicio y fin: en ese momento se vuelve un proyecto y aparece como barra en el Cronograma.","Cronograma (Gantt): cada barra es una meta con fechas; el color indica el plazo, verde = cumplida, y la l\xEDnea roja vertical marca hoy."]},{id:"cuenta",t:"Cuenta y sincronizaci\xF3n en la nube",c:["Abre Cuenta con el icono de nube (\u2601\uFE0F) de la barra superior. Su color te dice el estado: verde = sincronizado, \xE1mbar = sincronizando o sin conexi\xF3n, gris = sin cuenta.","Crea tu cuenta con correo y contrase\xF1a (m\xEDnimo 6 caracteres) y entra. Con la misma cuenta en tu celular y tu PC ver\xE1s los mismos datos.","La primera vez, entra en el dispositivo que ya tiene tus datos: ese los sube a la nube. En los dem\xE1s dispositivos, al entrar, se descargan.","Importante: antes de iniciar sesi\xF3n por primera vez, exporta un respaldo en Cierre. Es tu red de seguridad.","Funciona sin internet: los cambios se guardan en el dispositivo y suben a la nube en cuanto vuelve la conexi\xF3n.","Por ahora cada usuario tiene sus propios datos sincronizados entre sus dispositivos. Compartir cartera entre varios usuarios con roles es una mejora futura."]},{id:"visitas",t:"Visitas y check-in",c:["Abre Visitas con el icono de ubicaci\xF3n (\u{1F4CD}) de la barra superior; un punto \xE1mbar avisa si tienes una visita de hoy sin check-in.","Programa una visita (suelta o ligada a una oportunidad del pipeline, que autocompleta el cliente) con fecha y hora de inicio y de t\xE9rmino, cliente, notas y resultado. El bot\xF3n Agendar en Google Calendar crea el evento con ese horario.","Check-in: al llegar con el cliente, toca \xABEstoy aqu\xED\xBB y la app guarda tu ubicaci\xF3n GPS y la hora exacta. La primera vez el tel\xE9fono pedir\xE1 permiso de ubicaci\xF3n: ac\xE9ptalo.","Cada visita con check-in muestra \xABVer en mapa\xBB (abre Google Maps en el punto) y la precisi\xF3n en metros.","Marca el resultado (Inter\xE9s, Cotizaci\xF3n, Pedido/cierre, Sin inter\xE9s, Reagendar) para dar seguimiento despu\xE9s."]},{id:"asistente",t:"Asistente por voz",c:["\xC1brelo con el micr\xF3fono de la barra superior. Dicta o escribe varias cosas seguidas y toca Interpretar: la app las clasifica en pendientes, oportunidades, metas o registros de tiempo.","Vista previa: toca cualquier elemento para incluirlo o excluirlo antes de Crear.","Motor Local (gratis): entiende patrones como 'Llamar a Preisa ma\xF1ana a las 10', 'Visita con CFE el viernes de 9 a 11', 'Oportunidad con Femsa por 250 mil, cotizado', 'Meta corto plazo: cerrar 3 proyectos', 'Registra 45 minutos de traslados'.","Motor Claude API (opcional): entiende lenguaje totalmente libre usando tu propia clave de console.anthropic.com. La clave se guarda solo en tu dispositivo, nunca viaja en los respaldos, y el costo es de centavos por dictado.","El dictado usa el reconocimiento del navegador: funciona mejor en Chrome."]},{id:"comisiones",t:"Comisiones",c:["La pesta\xF1a Comisiones (icono %) se alimenta sola de las oportunidades en etapa Facturado.","Para cada facturada calcula la utilidad (monto \xD7 margen) y, con el porcentaje de comisi\xF3n que captures, tu comisi\xF3n. El porcentaje es propio de cada oportunidad.","Arriba eliges el mes (por fecha de factura) y ves el resumen: utilidad total, comisi\xF3n total, comisi\xF3n pagada y pendiente de pago.","Marca \xABPagado\xBB cuando te liquiden la comisi\xF3n (normalmente al mes siguiente); el resumen reparte autom\xE1ticamente entre pagado y pendiente.","El bot\xF3n \xABCalcular comisiones\xBB del Pipeline sigue disponible para un c\xE1lculo r\xE1pido sobre cualquier oportunidad facturada."]},{id:"cierre",t:"Cierre \u2014 reportes, exportar y respaldo",c:["Cierre de semana: tus n\xFAmeros de la semana y Copiar resumen para pegarlo en un reporte o mensaje a tu jefe.","Exportar: \xABPipeline en Excel\xBB genera un .xlsx ordenado como el flujo de venta (Oportunidad, Etapa, Cliente, Cotizaci\xF3n y su fecha, Monto en pesos y su equivalente en d\xF3lares, Margen, OC, Pedido, Factura y sus fechas, luego utilidad/comisi\xF3n y datos de contacto), con las columnas de dinero en formato de moneda. La columna Monto (USD) usa el importe original si la oportunidad se captur\xF3 en d\xF3lares, o el equivalente al tipo de cambio actual si fue en pesos. \xABPipeline para Monday\xBB y los dem\xE1s generan CSV para \xABImportar datos \u2192 Excel/CSV\xBB en tu tablero.","Enviar a Google Tasks / Keep: filtra pendientes, completados o todos, y Compartir abre el men\xFA de Android (Tasks crea una tarea con la lista; Keep una nota). Copiar lista sirve para pegar en la PC.","Respaldo de datos: Exportar genera un .json completo; Importar lo restaura en otro dispositivo o tras un cambio de tel\xE9fono.","Mejoras de la app: anota cualquier fricci\xF3n; el bot\xF3n Copiar lista para Claude arma el mensaje exacto para pedir la siguiente versi\xF3n."]},{id:"vers",t:"Novedades por versi\xF3n",c:["v5.5.0 \u2014 Se corrigi\xF3 el l\xEDmite de 1000: ahora la app trae TODOS los registros de la nube (paginando), as\xED ves tus miles de clientes completos. Adem\xE1s, en la lista de clientes puedes ordenar por nombre (A\u2192Z / Z\u2192A) o por n\xFAmero de cliente (ascendente / descendente).","v5.4.0 \u2014 Reportes financieros (Fase 5, en modo ERP): tablero con del embudo a la caja (cotizado\u2192ganado\u2192facturado\u2192margen y % de conversi\xF3n), facturado por mes (12 meses), ranking por vendedor y por marca, y comisiones. Con bot\xF3n para exportar todo el reporte a Excel. Se alimenta solo de lo que ya capturas.","v5.3.0 \u2014 Importar clientes desde Excel (No., Cliente, Segmento, Ciudad, Entidad) con dedupe autom\xE1tico, y n\xFAmero de cliente en toda la app: en clientes y oportunidades ahora puedes buscar por n\xFAmero (del sistema Elektron), no solo por raz\xF3n social. Al elegir cliente en una oportunidad se autollena su n\xFAmero.","v5.0.0 \u2014 Brida ahora es ERP + CRM. Fase 2: costo y margen real por trato (venta \u2212 costo), con m\xE1rgenes por marca en An\xE1lisis. Fase 3: compras a proveedores \u2014 registra las OC a Schneider/Siemens con tiempos de entrega, y un tablero \xABCompras y entregas\xBB con pendientes, en tr\xE1nsito y entregas atrasadas.","v4.9.0 \u2014 Pedidos y facturas multi-l\xEDnea (Fase 1 del ERP): cada oportunidad puede tener varios pedidos y varias facturas (# pedido, # factura, fecha, monto sin IVA, facturista, estado y marca de reasignada). Nuevo tablero \xABControl de facturaci\xF3n\xBB con facturas sin reasignar, sin facturar y total facturado; la reasignaci\xF3n ahora exporta UNA fila por factura, as\xED ninguna se escapa.","v4.8.0 \u2014 Listas de precios por marca: al importar indicas la marca y la versi\xF3n (ej. Schneider \xB7 06 Abr 2026); re-subir actualiza precios. El cat\xE1logo muestra las listas cargadas por marca. La car\xE1tula queda guardada para todo el equipo (solo la re-subes para actualizar). En la lista de clientes, el fondo de la tarjeta cambia de color seg\xFAn su clasificaci\xF3n (clave, recurrente, pide y no cierra).","v4.7.0 \u2014 Margen en la cotizaci\xF3n: al elegir del cat\xE1logo ahora ves el costo neto, agregas con buscador y juegas con el margen (markup) \u2014 el precio se recalcula solo. Importador de precios afinado al formato Schneider (Cat\xE1logo, Descripci\xF3n, Precio de Lista, C\xF3digo Descuento).","v4.6.0 \u2014 Listas de precios con descuentos en el cat\xE1logo: importa tu car\xE1tula (c\xF3digo de descuento \u2192 factor) y tu lista de precios desde Excel. Cada producto guarda precio de lista y c\xF3digo de descuento, y el cat\xE1logo calcula solo el costo neto (precio de lista \xD7 factor).","v4.5.0 \u2014 Reasignaci\xF3n de facturas (gerente/admin): lista tus facturadas, completas zona, # de cliente y monto sin IVA, y exportas el Excel en el formato de reasignaci\xF3n al departamento (cotizaci\xF3n, pedido, factura, cotizador y vendedores se toman solos).","v4.4.0 \u2014 Tablero de equipo compartido: vendedor, cotizador y gerente ven el mismo pipeline (un registro por trato, sin duplicar montos). Cada oportunidad guarda qui\xE9n la trajo, qui\xE9n la cotiza y su origen (sucursal / vendedor de campo / directo). Nuevo filtro \xABTodas / Las que traje / Las que cotizo\xBB y rol de Cotizador. Lo personal (tareas, tiempo, metas) sigue siendo privado.","v4.3.2 \u2014 Se agreg\xF3 el sector OEM (Fabricante de Equipo Original) a los tipos de cliente.","v4.3.1 \u2014 Sectores de cliente de Elektron (comerciante, contratista el\xE9ctrico, industria, integradores, gobierno, etc.) para clasificar mejor a cada cuenta.","v4.3.0 \u2014 Cuentas clave y clasificaci\xF3n de clientes: marca manual de cuenta clave e Integrador Alliance, detecci\xF3n autom\xE1tica por historial (3+ ganadas), aviso de prioridad al abrir una oportunidad, y colores en el pipeline (dorado clave, verde recurrente, negro \xABpide y no cierra\xBB).","v4.2.0 \u2014 Tiempos de cotizaci\xF3n: fecha de oportunidad entrante y c\xE1lculo del tiempo de respuesta (entrante \u2192 cotizaci\xF3n) y ciclo total, con foco en rojo para clientes con +24 h sin cotizar. Se renombr\xF3 \xABacuerdo de visita\xBB a \xABoportunidad entrante\xBB.","v4.1.0 \u2014 Recordatorios por correo: un aviso diario con lo vencido, por vencer (3 d\xEDas), sin cotizar (+24 h) y el cierre de mes.","v4.0 \u2014 Brida CRM: Clientes y contactos, oportunidades ligadas a cliente, bit\xE1cora de actividades y seguimiento, cotizaciones con cat\xE1logo y PDF/Excel en formato Elektron, an\xE1lisis y pron\xF3stico, tableros de gerente con roles, y dise\xF1o para computadora (barra lateral en pantalla grande).","v3.6 \u2014 Nuevo importador: sube el Excel exportado de Monday y crea las oportunidades autom\xE1ticamente (cliente, t\xEDtulo, monto en pesos o d\xF3lares, vendedor, cotizaci\xF3n, OC, sucursal y notas). Detecta y omite las que ya tienes para no duplicarlas.","v3.5 \u2014 Ahora puedes duplicar una oportunidad desde su ficha: crea una copia con los mismos datos y abre el editor para cambiar solo lo necesario.","v3.4 \u2014 Al filtrar por mes en el pipeline ahora tambi\xE9n ves lo Cotizado en ese mes (seg\xFAn la fecha de cotizaci\xF3n) y cu\xE1ntas cotizaciones fueron, junto a Pedido, Facturado y Movimientos.","v3.3 \u2014 El Excel del pipeline incluye una columna Monto (USD) junto a la de pesos: muestra el importe original en d\xF3lares si as\xED se captur\xF3, o el equivalente al tipo de cambio actual.","v3.2 \u2014 El Excel del pipeline se reorden\xF3 siguiendo el flujo de venta: Oportunidad, Etapa, Cliente, Cotizaci\xF3n y su fecha, Monto, Margen, OC, Pedido, Factura y sus fechas, y al final utilidad/comisi\xF3n y datos de contacto.","v3.1 \u2014 Nuevo \xABPedir estatus a vendedores\xBB en el Pipeline: agrupa las oportunidades en curso por vendedor y genera un mensaje claro y numerado (con rengl\xF3n Estatus) para enviar por WhatsApp o compartir. Tambi\xE9n disponible por oportunidad desde su ficha.","v3.0 \u2014 Nuevo tema visual en negro y rojo; el tipo de cambio admite hasta 4 decimales para ver el d\xF3lar con m\xE1s detalle; las visitas ya no guardan fotos (para no consumir memoria del dispositivo).","v2.9 \u2014 Las visitas ahora tienen fecha y hora de t\xE9rmino (adem\xE1s de las de inicio) y un bot\xF3n para agendarlas directamente en Google Calendar.","v2.8 \u2014 Cuenta en la nube (icono \u2601\uFE0F): inicia sesi\xF3n con correo y contrase\xF1a y tus datos se sincronizan autom\xE1ticamente entre tu celular y tu PC. Sigue funcionando sin internet y sincroniza al reconectar.","v2.7 \u2014 Nuevo m\xF3dulo de Visitas (icono de ubicaci\xF3n en la barra superior): programa visitas sueltas o ligadas a una oportunidad, haz check-in por GPS al llegar con hora y ubicaci\xF3n, marca el resultado y adjunta foto del lugar.","v2.6 \u2014 Captura de oportunidades en pesos o d\xF3lares con switch MXN/USD (todo se guarda en pesos); tipo de cambio USD\u2192MXN editable en la pantalla de inicio, con actualizaci\xF3n autom\xE1tica por internet.","v2.5 \u2014 El buscador del pipeline tambi\xE9n encuentra por n\xFAmero de cotizaci\xF3n, OC, pedido o factura; nuevo campo Vendedor en la oportunidad (buscable y en las exportaciones).","v2.4 \u2014 Nueva pesta\xF1a Comisiones: se alimenta de las facturadas, con % de comisi\xF3n propio por oportunidad, filtro por mes, totales de utilidad y comisi\xF3n (pagada/pendiente) y marca de \xABPagado\xBB. El Excel incluye columnas de utilidad y comisi\xF3n.","v2.3 \u2014 El pipeline abre en \xABTodas\xBB y se ordena por etapa y monto (mayor primero); se quita el filtro \xABActivas\xBB; la pantalla de inicio muestra el total cotizado y el n\xFAmero de cotizaciones; exportaci\xF3n a Excel (.xlsx) con formato de moneda.","v2.2 \u2014 OC recibida va antes de Pedido realizado, con fecha de OC; la regleta superior monitorea el total cotizado; el manual ahora incluye la ilustraci\xF3n de cada pantalla.","v2.1 \u2014 Fechas de cotizaci\xF3n, pedido y factura (se sellan solas al avanzar); se elimina la etapa Ganado (Pedido ya implica venta ganada); Activas son solo visita, cotizado y por cerrar; flujo de etapas ilustrado en este manual.","v2.0 \u2014 Resumen del pipeline con Pedido y Facturado y acumulado por mes; margen y calculadora de comisiones; N\xB0 de cotizaci\xF3n y OC del cliente; filtro Todas al inicio.","v1.9 \u2014 Comentarios en los pendientes; orden por prioridad en Hoy; los registros de tiempo de d\xEDas anteriores ya se pueden eliminar.","v1.8 \u2014 El nombre Brida en la barra superior regresa a la pantalla de inicio.","v1.7 \u2014 Pantalla de inicio en cada apertura: fecha completa con a\xF1o y resumen de pendientes del d\xEDa estilo notificaciones.","v1.6 \u2014 Pantalla de inicio y este manual con \xEDndice (bot\xF3n ?); N\xB0 de pedido y factura con etapa Facturado; metas con fechas y cronograma Gantt.","v1.5 \u2014 Env\xEDo de pendientes a Google Tasks y Keep: lista con filtro y bot\xF3n individual por pendiente.","v1.4 \u2014 Agendar en Google Calendar; horas de inicio y fin en pendientes; Asistente por voz con int\xE9rprete Local y Claude API.","v1.3 \u2014 Correcci\xF3n de estilos en la versi\xF3n publicada (Tailwind incluido en el archivo).","v1.2 \u2014 Versi\xF3n PWA instalable con guardado local y Respaldo exportar/importar.","v1.1 \u2014 Bit\xE1cora de mejoras con generador de prompt para Claude.","v1.0 \u2014 Tablero inicial: pendientes, tiempo, pipeline, metas, cierre de d\xEDa/semana y export a Monday."]}],I0=Object.fromEntries(Object.entries(Qv).map(([e,t])=>[e,"data:image/svg+xml;utf8,"+encodeURIComponent(t)]));function tI({onCerrar:e}){let[t,a]=(0,O.useState)(null);return(0,n.jsx)("div",{className:"fixed inset-0 z-50 flex flex-col justify-end",style:{background:"rgba(20,28,38,0.55)"},onClick:e,children:(0,n.jsxs)("div",{className:"rounded-t-2xl max-h-full overflow-y-auto w-full max-w-xl mx-auto",style:{background:l.fondo},onClick:r=>r.stopPropagation(),children:[(0,n.jsxs)("div",{classNa
